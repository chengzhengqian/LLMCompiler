[project]
name = "intentcompiler"
version = "0.1.0"
description = "A step-visible compiler from human intent to verified code, driven by local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ic = "ic.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic"]

